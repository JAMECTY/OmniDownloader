name: Build unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'OmniDownloader-iOS/**'
      - '.github/workflows/ios-build.yml'

jobs:
  build-ipa:
    name: Build and package IPA
    runs-on: macos-15

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Select Xcode 16.4
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          xcodebuild -version

      - name: Build iOS app without signing
        working-directory: OmniDownloader-iOS
        run: |
          set -o pipefail
          xcodebuild build \
            -project OmniDownloader.xcodeproj \
            -scheme OmniDownloader \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" 2>&1 | tee build.log

      - name: Package unsigned IPA
        working-directory: OmniDownloader-iOS
        run: |
          test -d build/Build/Products/Release-iphoneos/OmniDownloader.app
          mkdir -p build/Payload
          cp -R build/Build/Products/Release-iphoneos/OmniDownloader.app build/Payload/
          cd build
          ditto -c -k --sequesterRsrc --keepParent Payload OmniDownloader.ipa
          ls -lh OmniDownloader.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: OmniDownloader-iOS-unsigned-IPA
          path: OmniDownloader-iOS/build/OmniDownloader.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OmniDownloader-iOS-build-log
          path: OmniDownloader-iOS/build.log
          if-no-files-found: ignore
          retention-days: 14
